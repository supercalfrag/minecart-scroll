<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
>
  <!-- Sharp speed lines -->
  <path
    d="M2 8H7
       M1 11H6
       M3 14H8"
    stroke="#000"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Wheelie minecart -->
  <g transform="rotate(-10 15 12)">
    <!-- Cart body -->
    <path
      d="M8 7H21L19 13H10L8 7Z"
      fill="#000"
    />

    <!-- Upper rim -->
    <path
      d="M7.5 6H21.5"
      stroke="#000"
      stroke-width="2"
      stroke-linecap="round"
    />

    <!-- Undercarriage -->
    <path
      d="M10 14H19"
      stroke="#000"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Minecart wheels -->
    <circle
      cx="11"
      cy="16"
      r="2"
      fill="#000"
    />

    <circle
      cx="19"
      cy="15"
      r="2"
      fill="#000"
    />

    <!-- Flanged wheel centers -->
    <circle
      cx="11"
      cy="16"
      r="0.7"
      fill="white"
    />

    <circle
      cx="19"
      cy="15"
      r="0.7"
      fill="white"
    />
  </g>
</svg>